# 每次更新都在 Windows 和 macOS 上各跑一遍自检（和 install 脚本第 5 步一样，不需要 OpenCode、不碰任何数据）
name: test
on: [push, pull_request]
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m pytest -q -p no:cacheprovider tests
